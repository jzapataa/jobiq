name: Finalize Foundation Documentation

on:
  push:
    branches:
      - feature/foundation-00

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/foundation-00

      - name: Restore original FINAL documents
        run: |
          cat .foundation-docs/bp_* | base64 -d | gzip -d > docs/JOBIQ_BLUEPRINT_v0.1_FINAL.md
          cat .foundation-docs/td_* | base64 -d | gzip -d > docs/JOBIQ_TECHNICAL_DESIGN_v0.1_FINAL.md
          echo 'f8f429925d3729a10cd4097d45094df6428549a432673ae562d5ecf93da23d59  docs/JOBIQ_BLUEPRINT_v0.1_FINAL.md' | sha256sum -c -
          echo 'dc79ec4aeaab6844950619c1caca78a7ce48548f521285cdf7cb106472c56d9f  docs/JOBIQ_TECHNICAL_DESIGN_v0.1_FINAL.md' | sha256sum -c -

      - name: Commit original FINAL documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/JOBIQ_BLUEPRINT_v0.1_FINAL.md docs/JOBIQ_TECHNICAL_DESIGN_v0.1_FINAL.md
          git commit -m "docs: add final architecture sources"
          git push origin HEAD:feature/foundation-00
