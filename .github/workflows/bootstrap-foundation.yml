name: Bootstrap Foundation Toolchains

on:
  push:
    branches:
      - feature/foundation-00

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/foundation-00

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate Maven Wrapper
        working-directory: backend
        run: mvn -N wrapper:wrapper -Dmaven=3.9.11

      - name: Resolve Expo SDK 57 dependencies
        working-directory: mobile
        run: |
          npm install expo@~57.0.21 react@19.2.3 react-dom@19.2.3 react-native@0.86.3 react-native-web@~0.21.0 axios@^1.12.2 zustand@^5.0.8
          npx expo install expo-router expo-secure-store react-native-gesture-handler react-native-reanimated react-native-worklets expo-font react-native-safe-area-context react-native-screens expo-status-bar
          npm install --save-dev typescript@~6.0.3 @types/react@~19.2.2 eslint eslint-config-expo jest jest-expo @types/jest@29.5.14
          npx expo install --fix

      - name: Commit resolved toolchains
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/.mvn backend/mvnw backend/mvnw.cmd mobile/package.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock foundation toolchains"
            git push origin HEAD:feature/foundation-00
          fi

      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B verify

      - name: Start local PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' jobiq-postgres 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Smoke start backend LOCAL
        working-directory: backend
        run: |
          SPRING_PROFILES_ACTIVE=local java -jar target/jobiq-backend-*.jar > /tmp/jobiq-local.log 2>&1 &
          echo $! > /tmp/jobiq-local.pid
          for attempt in {1..45}; do
            if curl --silent --fail http://localhost:8080/actuator/health/liveness >/tmp/liveness.json; then
              cat /tmp/liveness.json
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              cat /tmp/jobiq-local.log
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/actuator/health)" = "403"

      - name: Build Docker image
        run: docker build -t jobiq-api:foundation ./backend

      - name: Smoke Docker image
        run: |
          kill "$(cat /tmp/jobiq-local.pid)" || true
          docker run --detach --rm \
            --name jobiq-api-foundation \
            --network host \
            -e SPRING_PROFILES_ACTIVE=local \
            -e DB_URL=jdbc:postgresql://localhost:5432/jobiq \
            -e DB_USERNAME=jobiq \
            -e DB_PASSWORD=jobiq-local \
            -e PORT=18081 \
            jobiq-api:foundation
          for attempt in {1..45}; do
            if curl --silent --fail http://localhost:18081/actuator/health/liveness >/tmp/container-liveness.json; then
              cat /tmp/container-liveness.json
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs jobiq-api-foundation
              exit 1
            fi
            sleep 2
          done

      - name: Validate mobile
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/jobiq-local.pid ]; then kill "$(cat /tmp/jobiq-local.pid)" || true; fi
          docker rm -f jobiq-api-foundation >/dev/null 2>&1 || true
          docker compose down
