name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Java version
        run: java -version

      - name: Verify
        run: ./mvnw -B verify

      - name: Start local PostgreSQL
        working-directory: .
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        working-directory: .
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' jobiq-postgres 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Smoke start backend in LOCAL
        run: |
          SPRING_PROFILES_ACTIVE=local java -jar target/jobiq-backend-*.jar > /tmp/jobiq-local.log 2>&1 &
          echo $! > /tmp/jobiq-local.pid
          for attempt in {1..45}; do
            if curl --silent --fail http://localhost:8080/actuator/health/liveness >/tmp/liveness.json; then
              cat /tmp/liveness.json
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              cat /tmp/jobiq-local.log
              exit 1
            fi
            sleep 2
          done
          generic_health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/actuator/health)"
          test "$generic_health_status" = "401" || test "$generic_health_status" = "403"

      - name: Build backend image
        working-directory: .
        run: docker build -t jobiq-api:foundation ./backend

      - name: Smoke start backend image
        working-directory: .
        run: |
          kill "$(cat /tmp/jobiq-local.pid)" || true
          docker run --detach --rm \
            --name jobiq-api-foundation \
            --network host \
            -e SPRING_PROFILES_ACTIVE=local \
            -e DB_URL=jdbc:postgresql://localhost:5432/jobiq \
            -e DB_USERNAME=jobiq \
            -e DB_PASSWORD=jobiq-local \
            -e PORT=18081 \
            jobiq-api:foundation
          for attempt in {1..45}; do
            if curl --silent --fail http://localhost:18081/actuator/health/liveness >/tmp/container-liveness.json; then
              cat /tmp/container-liveness.json
              exit 0
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs jobiq-api-foundation
              exit 1
            fi
            sleep 2
          done

      - name: Cleanup
        if: always()
        working-directory: .
        run: |
          if [ -f /tmp/jobiq-local.pid ]; then kill "$(cat /tmp/jobiq-local.pid)" || true; fi
          docker rm -f jobiq-api-foundation >/dev/null 2>&1 || true
          docker compose down

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate Android bundle
        run: npx expo export --platform android --output-dir dist
