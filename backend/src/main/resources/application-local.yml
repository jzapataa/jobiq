spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobiq}
    username: ${DB_USERNAME:jobiq}
    password: ${DB_PASSWORD:jobiq-local}
  jpa:
    properties:
      hibernate:
        format_sql: true

jobiq:
  security:
    jwt:
      secret: ${JWT_SECRET:jobiq-local-development-jwt-secret-change-me-2026}
      issuer: ${JWT_ISSUER:jobiq-api-local}

logging:
  level:
    com.jobiq: DEBUG
